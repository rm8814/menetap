<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/fonts.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/colors.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/typography.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/spacing.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/shadows.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/motion.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/styles.css">
<script src="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body{margin:0;background:#F7F6FF;font-family:'JetBrains Mono',monospace;color:#0C0A1E}
a{color:#7229FF;text-decoration:none}
a:hover{color:#5a1fd1;text-decoration:underline}
.wrap{max-width:560px;margin:0 auto;padding:0 24px;box-sizing:border-box}
</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="border-bottom:1px solid #E5E2F5;background:#fff">
    <div class="wrap" style="display:flex;align-items:center;height:64px;max-width:1240px">
      <a href="Menetap Homepage.dc.html" style="display:flex;align-items:center;gap:10px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.02em;color:#0C0A1E"><span>menetap<span style="color:#7229FF">.</span></span></a>
    </div>
  </header>

  <section style="flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px">
    <div class="wrap" style="background:#fff;border:1px solid #E5E2F5;border-radius:8px;padding:32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px">
      <div style="width:52px;height:52px;border-radius:50%;background:{{ iconBg }};display:flex;align-items:center;justify-content:center"><i data-lucide="{{ icon }}" style="width:24px;height:24px;color:{{ iconColor }}"></i></div>
      <h1 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;margin:0">{{ title }}</h1>
      <p style="font-size:13px;color:rgba(12,10,30,0.65);margin:0;line-height:1.6">{{ message }}</p>
      <sc-if value="{{ showRef }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:12px;font-weight:700;background:#F7F6FF;border:1px solid #E5E2F5;border-radius:24px;padding:6px 14px">Reference {{ refCode }}</div>
      </sc-if>
      <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;justify-content:center">
        <a href="{{ primaryLink }}"><x-import component-from-global-scope="AnindaWidaDesignSystem_d6f5df.Button" hint-size="180px,44px" variant="primary" size="md">{{ primaryLabel }}</x-import></a>
        <a href="Menetap During Stay.dc.html"><x-import component-from-global-scope="AnindaWidaDesignSystem_d6f5df.Button" hint-size="150px,44px" variant="outline" size="md">Contact support</x-import></a>
      </div>
    </div>
  </section>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const VARIANTS = {
  confirmfail: { icon: 'alert-triangle', iconBg: 'rgba(230,162,60,0.12)', iconColor: '#b8860b', title: 'Payment received — finalizing your booking', message: "We've charged your card successfully, but confirming the reservation with the property is taking longer than expected. We'll email you the moment it's confirmed — no need to pay again.", showRef: true, refCode: 'PMT-9K21XZ', primaryLink: 'Menetap My Trips.dc.html', primaryLabel: 'View in My Trips' },
  pending: { icon: 'clock', iconBg: 'rgba(0,202,239,0.1)', iconColor: '#0a8aa3', title: 'Booking placed — payment verifying', message: 'Your reservation is held, but your bank is still verifying the charge. This usually clears within a few minutes; we will not release your room hold in the meantime.', showRef: true, refCode: 'MTP-2Q7VBN', primaryLink: 'Menetap My Trips.dc.html', primaryLabel: 'View in My Trips' },
  soldout: { icon: 'circle-x', iconBg: 'rgba(192,57,43,0.08)', iconColor: '#c0392b', title: 'That room just sold out', message: "Another guest booked the last room while you were checking out. You haven't been charged. Please pick a different room or dates.", showRef: false, primaryLink: 'Menetap Room Selection.dc.html', primaryLabel: 'Choose another room' },
  ratechange: { icon: 'trending-up', iconBg: 'rgba(230,162,60,0.12)', iconColor: '#b8860b', title: 'The rate changed before you paid', message: 'The property updated pricing or availability while you were checking out. Review the new total before continuing — you have not been charged.', showRef: false, primaryLink: 'Menetap Room Selection.dc.html', primaryLabel: 'Review new rate' },
  race: { icon: 'users', iconBg: 'rgba(192,57,43,0.08)', iconColor: '#c0392b', title: 'Someone booked just before you', message: "Two guests tried to book the last room at nearly the same time, and the other booking was confirmed first. You have not been charged.", showRef: false, primaryLink: 'Menetap Room Selection.dc.html', primaryLabel: 'See similar rooms' }
};
class Component extends DCLogic {
  componentDidMount() { if (window.lucide) window.lucide.createIcons(); }
  componentDidUpdate() { if (window.lucide) window.lucide.createIcons(); }
  renderVals() {
    const key = (typeof localStorage!=='undefined' && localStorage.getItem('menetapBookingIssue')) || 'confirmfail';
    return { ...VARIANTS[key] || VARIANTS.confirmfail };
  }
}

</script>
</body>
</html>
