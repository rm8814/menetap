name: Deploy Convex

on:
  push:
    branches: [main]
    paths: ['app/convex/**', 'app/package.json', 'app/package-lock.json', '.github/workflows/convex-deploy.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx convex deploy --typecheck enable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
