<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/fonts.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/colors.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/typography.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/spacing.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/shadows.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/motion.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/styles.css">
<script src="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body{margin:0;background:#F7F6FF;font-family:'JetBrains Mono',monospace;color:#0C0A1E}
a{color:#7229FF;text-decoration:none}
.wrap{max-width:640px;margin:0 auto;padding:0 24px;box-sizing:border-box}
</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="border-bottom:1px solid #E5E2F5;background:#fff">
    <div class="wrap" style="display:flex;align-items:center;height:64px;max-width:1240px">
      <a href="Menetap Supply Landing.dc.html" style="display:flex;align-items:center;gap:9px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.02em;color:#0C0A1E"><span>menetap<span style="color:#7229FF">.</span></span> <span style="font-size:11px;font-weight:600;color:rgba(12,10,30,0.4);margin-left:2px">supply</span></a>
    </div>
  </header>

  <div class="wrap" style="padding:48px 24px 64px;display:flex;flex-direction:column;gap:24px">
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px">
      <div style="width:56px;height:56px;border-radius:50%;background:rgba(0,202,239,0.1);display:flex;align-items:center;justify-content:center"><i data-lucide="check" style="width:28px;height:28px;color:#0a8aa3"></i></div>
      <h1 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:22px;margin:0">Order placed</h1>
      <p style="font-size:13px;color:rgba(12,10,30,0.6);margin:0">Your supplies will ship to {{ propertyName }} within 2–4 business days.</p>
      <div style="font-size:12px;font-weight:700;background:rgba(114,41,255,0.06);border:1px solid #E5E2F5;border-radius:24px;padding:6px 14px;margin-top:4px">Order <span style="color:#7229FF">{{ orderCode }}</span></div>
    </div>

    <div style="background:#fff;border:1px solid #E5E2F5;border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between"><span style="font-size:13px;color:rgba(12,10,30,0.6)">Property</span><span style="font-size:13px;font-weight:700">{{ propertyName }}</span></div>
      <div style="height:1px;background:#E5E2F5"></div>
      <div style="display:flex;justify-content:space-between;font-size:15px"><span style="font-weight:700">Total</span><span style="font-weight:800;font-family:'Plus Jakarta Sans',sans-serif">{{ totalLabel }}</span></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <a href="Menetap Supply Catalog.dc.html"><x-import component-from-global-scope="AnindaWidaDesignSystem_d6f5df.Button" hint-size="100%,44px" variant="outline" size="md">Order more</x-import></a>
      <a href="Menetap Partner Dashboard.dc.html"><x-import component-from-global-scope="AnindaWidaDesignSystem_d6f5df.Button" hint-size="100%,44px" variant="primary" size="md">Back to dashboard</x-import></a>
    </div>
  </div>

  <footer style="border-top:1px solid #E5E2F5;padding:24px 0;margin-top:auto;background:#fff">
    <div class="wrap" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;max-width:1240px">
      <div style="font-size:12px;color:rgba(12,10,30,0.5)">© 2026 Menetap. All rights reserved.</div>
      <div style="display:flex;align-items:center;gap:10px"><div onClick="{{ toggleLang }}" style="display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:rgba(12,10,30,0.5);cursor:pointer;border:1px solid #E5E2F5;border-radius:24px;padding:5px 12px"><i data-lucide="globe" style="width:12px;height:12px"></i>{{ langLabel }}</div></div>
    </div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() { if (window.lucide) window.lucide.createIcons(); }
  renderVals() {
    return {
      langLabel: ((this.state.__lang || (typeof localStorage!=='undefined' && localStorage.getItem('menetapLang')) || 'en') === 'en') ? 'EN' : 'ID',
      toggleLang: () => { const cur = this.state.__lang || (typeof localStorage!=='undefined' && localStorage.getItem('menetapLang')) || 'en'; const next = cur === 'en' ? 'id' : 'en'; if (typeof localStorage!=='undefined') localStorage.setItem('menetapLang', next); this.setState({ __lang: next }); },
      orderCode: 'SUP-3F91RK',
      propertyName: (typeof localStorage!=='undefined' && localStorage.getItem('menetapSupplyOrderProperty')) || 'your property',
      totalLabel: 'Rp ' + Number((typeof localStorage!=='undefined' && localStorage.getItem('menetapSupplyOrderTotal')) || 0).toLocaleString('en-US')
    };
  }
}

</script>
</body>
</html>
