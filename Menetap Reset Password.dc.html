<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/fonts.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/colors.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/typography.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/spacing.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/shadows.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/motion.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/styles.css">
<script src="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body{margin:0;background:#F7F6FF;font-family:'JetBrains Mono',monospace;color:#0C0A1E}
a{color:#7229FF;text-decoration:none}
a:hover{color:#5a1fd1;text-decoration:underline}
input[type="email"],input[type="password"]{font-family:'JetBrains Mono',monospace;font-size:13px;border:1px solid #E5E2F5;border-radius:6px;padding:11px 12px;outline:none;background:#fff;color:#0C0A1E;width:100%;box-sizing:border-box}
input:focus{border-color:#7229FF}
</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="border-bottom:1px solid #E5E2F5;background:#fff">
    <div style="max-width:1240px;margin:0 auto;padding:0 24px;display:flex;align-items:center;height:64px;box-sizing:border-box">
      <a href="Menetap Homepage.dc.html" style="display:flex;align-items:center;gap:10px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.02em;color:#0C0A1E"><span>menetap<span style="color:#7229FF">.</span></span></a>
    </div>
  </header>

  <section style="flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px">
    <div style="width:100%;max-width:380px;background:#fff;border:1px solid #E5E2F5;border-radius:8px;padding:32px;box-shadow:0 2px 8px rgba(114,41,255,0.06)">

      <sc-if value="{{ showRequest }}" hint-placeholder-val="{{ true }}">
        <h1 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:22px;margin:0 0 6px">Reset your password</h1>
        <p style="font-size:13px;color:rgba(12,10,30,0.6);margin:0 0 20px">Enter your email and we'll send a reset link.</p>
        <div style="display:flex;flex-direction:column;gap:14px">
          <div><label style="font-size:11px;font-weight:700;color:rgba(12,10,30,0.55);display:block;margin-bottom:5px">Email</label><input type="email" placeholder="you@email.com" value="{{ email }}" onInput="{{ onEmail }}" /></div>
          <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;color:#c0392b;background:rgba(192,57,43,0.08);border-radius:6px;padding:8px 10px">{{ error }}</div></sc-if>
          <x-import component-from-global-scope="AnindaWidaDesignSystem_d6f5df.Button" hint-size="100%,44px" variant="primary" size="md" onClick="{{ sendReset }}">Send reset link</x-import>
        </div>
      </sc-if>

      <sc-if value="{{ showSent }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px">
          <div style="width:48px;height:48px;border-radius:50%;background:rgba(0,202,239,0.1);display:flex;align-items:center;justify-content:center"><i data-lucide="mail-check" style="width:22px;height:22px;color:#0a8aa3"></i></div>
          <h1 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:19px;margin:0">Check your email</h1>
          <p style="font-size:13px;color:rgba(12,10,30,0.6);margin:0">We sent a reset link to <strong>{{ email }}</strong>. It expires in 30 minutes.</p>
          <div onClick="{{ backToRequest }}" style="font-size:12px;font-weight:600;color:#7229FF;cursor:pointer;margin-top:8px">Didn't get it? Try again</div>
        </div>
      </sc-if>

      <div style="font-size:12px;color:rgba(12,10,30,0.6);text-align:center;margin-top:20px"><a href="Menetap Login.dc.html">Back to log in</a></div>
    </div>
  </section>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { stage: 'request', email: '', error: '' };
  componentDidMount() { if (window.lucide) window.lucide.createIcons(); }
  componentDidUpdate() { if (window.lucide) window.lucide.createIcons(); }
  renderVals() {
    const s = this.state;
    return {
      showRequest: s.stage === 'request', showSent: s.stage === 'sent',
      email: s.email, onEmail: (e) => this.setState({ email: e.target.value, error: '' }),
      error: s.error,
      sendReset: () => { if (!s.email.includes('@')) { this.setState({ error: 'Enter a valid email address.' }); return; } this.setState({ stage: 'sent' }); },
      backToRequest: () => this.setState({ stage: 'request' })
    };
  }
}

</script>
</body>
</html>
