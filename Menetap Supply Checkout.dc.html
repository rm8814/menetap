<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/fonts.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/colors.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/typography.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/spacing.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/shadows.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/motion.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/styles.css">
<script src="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body{margin:0;background:#F7F6FF;font-family:'JetBrains Mono',monospace;color:#0C0A1E}
a{color:#7229FF;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px;box-sizing:border-box}
input[type="text"]{font-family:'JetBrains Mono',monospace;font-size:13px;border:1px solid #E5E2F5;border-radius:6px;padding:10px 12px;outline:none;background:#fff;color:#0C0A1E;width:100%;box-sizing:border-box}
@media (max-width:860px){.spcgrid{grid-template-columns:1fr !important}}
</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="border-bottom:1px solid #E5E2F5;background:#fff">
    <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;height:64px">
      <a href="Menetap Supply Landing.dc.html" style="display:flex;align-items:center;gap:9px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.02em;color:#0C0A1E"><span>menetap<span style="color:#7229FF">.</span></span> <span style="font-size:11px;font-weight:600;color:rgba(12,10,30,0.4);margin-left:2px">supply</span></a>
      <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(12,10,30,0.5)"><i data-lucide="lock" style="width:13px;height:13px;color:#00CAEF"></i>Secure checkout</div>
    </div>
  </header>

  <div class="wrap spcgrid" style="display:grid;grid-template-columns:1fr 340px;gap:32px;padding:32px 24px 64px">
    <div style="display:flex;flex-direction:column;gap:20px;min-width:0">
      <div style="background:#fff;border:1px solid #E5E2F5;border-radius:8px;padding:22px">
        <h2 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:17px;margin:0 0 14px">Delivery details</h2>
        <div style="display:flex;flex-direction:column;gap:12px">
          <div><label style="font-size:11px;font-weight:700;color:rgba(12,10,30,0.55);display:block;margin-bottom:5px">Property</label><input type="text" value="{{ propertyName }}" onInput="{{ onPropertyName }}" /></div>
          <div><label style="font-size:11px;font-weight:700;color:rgba(12,10,30,0.55);display:block;margin-bottom:5px">Delivery address</label><input type="text" value="{{ address }}" onInput="{{ onAddress }}" placeholder="Street, city" /></div>
          <div><label style="font-size:11px;font-weight:700;color:rgba(12,10,30,0.55);display:block;margin-bottom:5px">Receiving contact</label><input type="text" value="{{ contact }}" onInput="{{ onContact }}" placeholder="Name and phone number" /></div>
        </div>
      </div>

      <div style="background:#fff;border:1px solid #E5E2F5;border-radius:8px;padding:22px">
        <h2 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:17px;margin:0 0 14px">Billing</h2>
        <div style="display:flex;flex-direction:column;gap:10px">
          <label style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:8px;cursor:pointer;border:{{ billInvoiceBorder }}">
            <input type="radio" name="bill" checked="{{ billIsInvoice }}" onChange="{{ selectInvoice }}" style="accent-color:#7229FF" /><i data-lucide="file-text" style="width:16px;height:16px;color:#7229FF"></i><span style="font-size:13px;font-weight:600">Add to monthly Menetap statement</span>
          </label>
          <label style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:8px;cursor:pointer;border:{{ billCardBorder }}">
            <input type="radio" name="bill" checked="{{ billIsCard }}" onChange="{{ selectCard }}" style="accent-color:#7229FF" /><i data-lucide="credit-card" style="width:16px;height:16px;color:#7229FF"></i><span style="font-size:13px;font-weight:600">Pay by card now</span>
          </label>
        </div>
      </div>
    </div>

    <aside style="position:sticky;top:24px;align-self:flex-start;display:flex;flex-direction:column;gap:16px">
      <div style="background:#fff;border:1px solid #E5E2F5;border-radius:8px;box-shadow:0 2px 8px rgba(114,41,255,0.06);padding:20px;display:flex;flex-direction:column;gap:14px">
        <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:rgba(12,10,30,0.5)">Order summary</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <sc-for list="{{ cartLines }}" as="cl" hint-placeholder-count="2">
            <div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:rgba(12,10,30,0.65)">{{ cl.qty }}× {{ cl.name }}</span><span style="font-weight:600">{{ cl.subtotal }}</span></div>
          </sc-for>
        </div>
        <div style="height:1px;background:#E5E2F5"></div>
        <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:rgba(12,10,30,0.6)">Delivery</span><span>Rp 75,000</span></div>
        <div style="display:flex;justify-content:space-between;font-size:16px"><span style="font-weight:700">Total</span><span style="font-weight:800;font-family:'Plus Jakarta Sans',sans-serif">{{ grandTotal }}</span></div>
        <x-import component-from-global-scope="AnindaWidaDesignSystem_d6f5df.Button" hint-size="100%,50px" variant="primary" size="lg" onClick="{{ onConfirm }}">{{ confirmLabel }}</x-import>
      </div>
    </aside>
  </div>

  <footer style="border-top:1px solid #E5E2F5;padding:24px 0;margin-top:auto;background:#fff">
    <div class="wrap" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
      <div style="font-size:12px;color:rgba(12,10,30,0.5)">© 2026 Menetap. All rights reserved.</div>
      <div style="display:flex;align-items:center;gap:10px"><div onClick="{{ toggleLang }}" style="display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:rgba(12,10,30,0.5);cursor:pointer;border:1px solid #E5E2F5;border-radius:24px;padding:5px 12px"><i data-lucide="globe" style="width:12px;height:12px"></i>{{ langLabel }}</div></div>
    </div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
function fmt(n) { return 'Rp ' + Math.round(n).toLocaleString('en-US'); }
class Component extends DCLogic {
  state = { propertyName: 'Kaliurang Heritage Villa', address: '', contact: '', billMethod: 'invoice', confirming: false };
  componentDidMount() { if (window.lucide) window.lucide.createIcons(); }
  componentDidUpdate() { if (window.lucide) window.lucide.createIcons(); }
  renderVals() {
    const s = this.state;
    let cartLines = [];
    try { cartLines = JSON.parse((typeof localStorage!=='undefined' && localStorage.getItem('menetapSupplyCartLines')) || '[]'); } catch (e) {}
    const subtotal = Number((typeof localStorage!=='undefined' && localStorage.getItem('menetapSupplyCartTotal')) || 0);
    const grand = subtotal + 75000;
    return {
      langLabel: ((this.state.__lang || (typeof localStorage!=='undefined' && localStorage.getItem('menetapLang')) || 'en') === 'en') ? 'EN' : 'ID',
      toggleLang: () => { const cur = this.state.__lang || (typeof localStorage!=='undefined' && localStorage.getItem('menetapLang')) || 'en'; const next = cur === 'en' ? 'id' : 'en'; if (typeof localStorage!=='undefined') localStorage.setItem('menetapLang', next); this.setState({ __lang: next }); },
      propertyName: s.propertyName, onPropertyName: (e) => this.setState({ propertyName: e.target.value }),
      address: s.address, onAddress: (e) => this.setState({ address: e.target.value }),
      contact: s.contact, onContact: (e) => this.setState({ contact: e.target.value }),
      billIsInvoice: s.billMethod === 'invoice', billIsCard: s.billMethod === 'card',
      billInvoiceBorder: s.billMethod === 'invoice' ? '1px solid #7229FF' : '1px solid #E5E2F5',
      billCardBorder: s.billMethod === 'card' ? '1px solid #7229FF' : '1px solid #E5E2F5',
      selectInvoice: () => this.setState({ billMethod: 'invoice' }), selectCard: () => this.setState({ billMethod: 'card' }),
      cartLines, grandTotal: fmt(grand),
      confirming: s.confirming, confirmLabel: s.confirming ? 'Placing order…' : 'Place order',
      onConfirm: () => {
        if (s.confirming || !s.address || !s.contact) return;
        this.setState({ confirming: true });
        setTimeout(() => {
          if (typeof localStorage!=='undefined') { localStorage.setItem('menetapSupplyOrderTotal', String(grand)); localStorage.setItem('menetapSupplyOrderProperty', s.propertyName); }
          window.location.href = 'Menetap Supply Confirmation.dc.html';
        }, 1200);
      }
    };
  }
}

</script>
</body>
</html>
