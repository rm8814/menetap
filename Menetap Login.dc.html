<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/fonts.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/colors.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/typography.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/spacing.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/shadows.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/tokens/motion.css">
<link rel="stylesheet" href="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/styles.css">
<script src="_ds/aninda-wida-design-system-d6f5dfe1-8e49-40cd-9ecc-4d581038e63b/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body{margin:0;background:#F7F6FF;font-family:'JetBrains Mono',monospace;color:#0C0A1E}
a{color:#7229FF;text-decoration:none}
a:hover{color:#5a1fd1;text-decoration:underline}
input[type="text"],input[type="email"],input[type="password"]{font-family:'JetBrains Mono',monospace;font-size:13px;border:1px solid #E5E2F5;border-radius:6px;padding:11px 12px;outline:none;background:#fff;color:#0C0A1E;width:100%;box-sizing:border-box}
input:focus{border-color:#7229FF}
</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="border-bottom:1px solid #E5E2F5;background:#fff">
    <div style="max-width:1240px;margin:0 auto;padding:0 24px;display:flex;align-items:center;height:64px;box-sizing:border-box">
      <a href="Menetap Homepage.dc.html" style="display:flex;align-items:center;gap:10px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.02em;color:#0C0A1E">
        <span>menetap<span style="color:#7229FF">.</span></span>
      </a>
    </div>
  </header>

  <section style="flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px">
    <div style="width:100%;max-width:380px;background:#fff;border:1px solid #E5E2F5;border-radius:8px;padding:32px;box-shadow:0 2px 8px rgba(114,41,255,0.06)">
      <h1 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:24px;letter-spacing:-0.02em;margin:0 0 6px">Welcome back</h1>
      <p style="font-size:13px;color:rgba(12,10,30,0.6);margin:0 0 24px">Log in to manage your bookings and rewards.</p>

      <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px">
        <div style="display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #E5E2F5;border-radius:6px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;background:#fff"><i data-lucide="mail" style="width:16px;height:16px"></i>Continue with Google</div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
        <div style="flex:1;height:1px;background:#E5E2F5"></div><span style="font-size:11px;color:rgba(12,10,30,0.4)">OR</span><div style="flex:1;height:1px;background:#E5E2F5"></div>
      </div>

      <form onSubmit="{{ onSubmit }}" style="display:flex;flex-direction:column;gap:14px">
        <div>
          <label style="font-size:11px;font-weight:700;color:rgba(12,10,30,0.55);display:block;margin-bottom:5px">Email</label>
          <input type="email" placeholder="you@email.com" value="{{ email }}" onInput="{{ onEmail }}" required="{{ true }}" />
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;margin-bottom:5px"><label style="font-size:11px;font-weight:700;color:rgba(12,10,30,0.55)">Password</label><a href="Menetap Reset Password.dc.html" style="font-size:11px;font-weight:600">Forgot?</a></div>
          <div style="position:relative">
            <input type="{{ pwType }}" placeholder="••••••••" value="{{ password }}" onInput="{{ onPassword }}" required="{{ true }}" style="padding-right:38px" />
            <span onClick="{{ togglePw }}" style="position:absolute;right:11px;top:50%;transform:translateY(-50%);cursor:pointer;display:flex;color:rgba(12,10,30,0.45)"><i data-lucide="{{ pwIcon }}" style="width:16px;height:16px"></i></span>
          </div>
        </div>
        <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
          <div style="font-size:12px;color:#c0392b;background:rgba(192,57,43,0.08);border-radius:6px;padding:8px 10px">{{ error }}</div>
        </sc-if>
        <x-import component-from-global-scope="AnindaWidaDesignSystem_d6f5df.Button" hint-size="100%,44px" variant="primary" size="md">Log in</x-import>
      </form>

      <div style="font-size:12px;color:rgba(12,10,30,0.6);text-align:center;margin-top:20px">Don't have an account? <a href="Menetap Sign Up.dc.html">Sign up</a></div>
      <div style="font-size:12px;color:rgba(12,10,30,0.5);text-align:center;margin-top:8px"><a href="Menetap Partner Landing.dc.html">Log in as a partner instead</a></div>
    </div>
  </section>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: '', password: '', error: '', showPw: false };
  componentDidMount() { if (window.lucide) window.lucide.createIcons(); }
  componentDidUpdate() { if (window.lucide) window.lucide.createIcons(); }
  renderVals() {
    const s = this.state;
    return {
      email: s.email, onEmail: (e) => this.setState({ email: e.target.value, error: '' }),
      password: s.password, onPassword: (e) => this.setState({ password: e.target.value, error: '' }),
      pwType: s.showPw ? 'text' : 'password', pwIcon: s.showPw ? 'eye-off' : 'eye',
      togglePw: () => this.setState({ showPw: !s.showPw }),
      error: s.error,
      onSubmit: (e) => {
        e.preventDefault();
        if (!s.email || !s.password) { this.setState({ error: 'Enter your email and password.' }); return; }
        window.location.href = 'Menetap Homepage.dc.html';
      }
    };
  }
}

</script>
</body>
</html>
