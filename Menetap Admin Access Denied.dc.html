      </a>
      <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7229FF,#00CAEF);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700">FN</div>
    </div>
  </header>

  <div class="wrap" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:64px 24px">
    <div style="width:56px;height:56px;border-radius:50%;background:rgba(192,57,43,0.08);display:flex;align-items:center;justify-content:center"><i data-lucide="lock" style="width:26px;height:26px;color:#c0392b"></i></div>
    <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px">You don't have access to this page</div>
    <p style="font-size:13px;color:rgba(12,10,30,0.6);margin:0;max-width:380px">Team management is restricted to Superadmin. Your current role is <strong>Finance</strong>. Contact a Superadmin if you need access.</p>
    <a href="Menetap Admin Console.dc.html"><x-import component-from-global-scope="AnindaWidaDesignSystem_d6f5df.Button" hint-size="150px,44px" variant="primary" size="md">Back to dashboard</x-import></a>
    <a href="Menetap Admin Login.dc.html" style="font-size:12px;font-weight:600;color:rgba(12,10,30,0.5)">Log out and switch account</a>
  </div>

  <footer style="border-top:1px solid #E5E2F5;padding:24px 0;background:#fff">
    <div class="wrap" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
      <div style="font-size:12px;color:rgba(12,10,30,0.5)">© 2026 Menetap. All rights reserved.</div>
      
      <!-- langgroup --><div style="display:flex;align-items:center;gap:10px"><div onClick="{{ toggleLang }}" style="display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:rgba(12,10,30,0.5);cursor:pointer;border:1px solid #E5E2F5;border-radius:24px;padding:5px 12px"><i data-lucide="globe" style="width:12px;height:12px"></i>{{ langLabel }}</div><div style="display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(12,10,30,0.45);background:#F7F6FF;border:1px solid #E5E2F5;border-radius:24px;padding:5px 12px">
        Managed by <a href="https://upscale.asia" target="_blank" style="font-weight:700;color:#7229FF">UPSCALE</a>
      </div></div>
</div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() { if (window.lucide) window.lucide.createIcons(); }
  renderVals() {
    const l = this.state.__lang || (typeof localStorage!=='undefined' && localStorage.getItem('menetapLang')) || 'en';
    return {
      langLabel: l === 'en' ? 'EN' : 'ID',
      toggleLang: () => { const next = l === 'en' ? 'id' : 'en'; if (typeof localStorage!=='undefined') localStorage.setItem('menetapLang', next); this.setState({ __lang: next }); }
    };
  }
}
</script>
